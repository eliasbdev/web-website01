name: Awtomatikong Ilabas

on:
  push:
    branches:
      - main

jobs:
  ilabas:
    runs-on: ubuntu-latest
    steps:
      - name: Kunin ang code
        uses: actions/checkout@v4

      - name: Suriin ang mga file
        run: |
          if [ ! -f index.html ]; then
            echo "Nawawala ang index.html!"
            exit 1
          fi
          echo "✅ Kumpleto ang mga file"

      - name: Ilabas sa GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          
